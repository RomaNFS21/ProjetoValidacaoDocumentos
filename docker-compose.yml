services:
  postgres:
    image: postgres:17-alpine
    container_name: doc_validation_postgres
    restart: always
    environment:
      POSTGRES_DB: doc_validation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doc_validation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
