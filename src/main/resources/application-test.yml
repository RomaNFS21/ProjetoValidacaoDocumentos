spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false
  ai:
    openai:
      api-key: test-key

tesseract:
  datapath: tessdata
  language: por

ocr:
  tesseract:
    oem: 1
    psm: 3
  file:
    max-file-size-mb: 10
    pdf-dpi: 300
  preprocessing:
    debug:
      enabled: false
      output-dir: target/ocr-debug

