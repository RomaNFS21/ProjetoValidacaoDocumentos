spring:
  datasource:
    # H2 em memória com compatibilidade PostgreSQL para testes de integração
    # NON_KEYWORDS=VALUE evita colisão com palavra reservada H2 "VALUE"
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # Hibernate cria e destrói as tabelas automaticamente via entidades @Entity
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Dialeto explícito para H2 em modo test
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    # Desabilitado no perfil test: Hibernate gere o schema via ddl-auto
    enabled: false

  ai:
    openai:
      # Chave fictícia para testes: o ChatModel é mockado via @MockBean nos testes
      api-key: test-key-not-used

tesseract:
  datapath: tessdata
  language: por

ocr:
  tesseract:
    oem: 1
    psm: 3
  file:
    max-file-size-mb: 10
    pdf-dpi: 300
  preprocessing:
    debug:
      enabled: false
      output-dir: target/ocr-debug
