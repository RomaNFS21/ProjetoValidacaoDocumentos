spring:
  datasource:
    # H2 em memória com compatibilidade PostgreSQL (executa sem precisar de Docker ou PostgreSQL instalado)
    url: jdbc:h2:mem:doc_validation_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-local-key}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.1

tesseract:
  datapath: tessdata
  language: por

ocr:
  tesseract:
    oem: 1
    psm: 3
  file:
    max-file-size-mb: 10
    pdf-dpi: 300
  preprocessing:
    debug:
      enabled: false
      output-dir: target/ocr-debug

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

